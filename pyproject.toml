[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "turkish-mediabias"
version = "0.1.0"
description = "Evidence-grounded Turkish news comparison and annotation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "feedparser>=6.0,<7", "defusedxml>=0.7,<1", "beautifulsoup4>=4.12,<5",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "openpyxl>=3.1,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
[project.scripts]
mediabias = "mediabias.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/mediabias"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
